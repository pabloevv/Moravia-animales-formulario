  var LOGO_DARK = { r:14, g:15, b:33 };  // #0e0f21
  var N_TARGET = 4200;
  var DPR_CAP = 2;
  var LOOP = false;          // una sola pasada: al terminar, React muestra el webp
  var TIME_SCALE = 2;        // x2: la animacion corre al doble de velocidad

  var EYE_PREFIXES = ["M357.99,212.94", "M169.1,212.9"];

  var BALL_VB = { w:396, h:384.749986 };
  var BALL_SRC_VB = { x:0, y:0, w:396, h:384.749986 };
  var LOGO_VB = { w:527.49, h:383.02 };
  var BALL_RW = 512, BALL_RH = Math.round(512 * BALL_VB.h / BALL_VB.w);
  var LOGO_RW = 760, LOGO_RH = Math.round(760 * LOGO_VB.h / LOGO_VB.w);
  var BALL_DEFAULT_GEOM = { cx:187.5157, cy:174.5039, r:155.5 };
  var BALL_CX = BALL_DEFAULT_GEOM.cx, BALL_CY = BALL_DEFAULT_GEOM.cy, BALL_R = BALL_DEFAULT_GEOM.r; // circulo del balon (viewBox)
  var BALL_SPLIT = false, BALL_SPLIT_X = 0;
  var BALL_LAYER_CROPS = null;

  // ---- Linea de tiempo (s) ----
  var D = { ball:2.8, diss:0.6, morph:2.4, cry:0.55, hold:0.5, blink:1.6, exit:1.3, gap:0.45 };
  var T_BALL  = D.ball;
  var T_DISS  = T_BALL + D.diss;
  var T_MORPH = T_DISS + D.morph;
  var T_CRY   = T_MORPH + D.cry;
  var T_HOLD  = T_CRY + D.hold;
  var T_BLINK = T_HOLD + D.blink;
  var T_EXIT  = T_BLINK + D.exit;
  var T_END   = T_EXIT + D.gap;
  var STOP_AT = T_EXIT + 0.12;           // fin de grabacion (un ciclo)

  // ---- DOM ----
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var ballEl = document.getElementById("ball");
  var logoEl = document.getElementById("logo");
  var dlBtn = document.getElementById("dl");

  var W = 0, H = 0, dpr = 1;
  var ballBox = { x:0,y:0,w:0,h:0 };
  var logoBox = { x:0,y:0,w:0,h:0 };
  var particles = [];
  var startTs = null;
  var doneNotified = false;  // avisa al padre una sola vez cuando el logo queda armado

  var ballImg = null, ballTraceImg = null, ballColorImg = null, ballReady = false;
  var noEyesImg = null, eyesImg = null, logoImgReady = 0;
  var ballSamples = null, ballRasterDone = false, needRebuild = false;
  var ballTainted = false;
  var eyeBoxes = [];
  var assetsReady = false;

  // grabacion
  var recording = false, recorder = null, recCanvas = null, recCtx = null, recChunks = [];

  // ---- Easing ----
  function clamp01(t){ return t<0?0:(t>1?1:t); }
  function easeInOutCubic(t){ return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
  function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
  function easeInCubic(t){ return t*t*t; }
  function easeInOutSine(t){ return -(Math.cos(Math.PI*t)-1)/2; }
  function smoothstep(x){ x=clamp01(x); return x*x*(3-2*x); }

  function parseViewBox(el){
    var raw = (el.getAttribute("viewBox") || "").trim().split(/[\s,]+/);
    if (raw.length >= 4){
      return { x:+raw[0] || 0, y:+raw[1] || 0, w:+raw[2] || BALL_VB.w, h:+raw[3] || BALL_VB.h };
    }
    return {
      x:0,
      y:0,
      w:parseFloat(el.getAttribute("width")) || BALL_VB.w,
      h:parseFloat(el.getAttribute("height")) || BALL_VB.h
    };
  }

  function configureBallSource(){
    var vb = parseViewBox(ballEl);
    BALL_SRC_VB = vb;
    var mode = (ballEl.getAttribute("data-ball-layer-mode") || "").toLowerCase();
    BALL_SPLIT = mode === "split" || vb.w > vb.h * 1.45;

    if (BALL_SPLIT){
      var paneW = vb.w / 2;
      BALL_SPLIT_X = vb.x + paneW;
      if (vb.w > 700){
        var cropW = 337.90625;
        BALL_LAYER_CROPS = {
          trace: { x:0, y:0, w:cropW, h:vb.h },
          color: { x:525.429688 - cropW/2, y:0, w:cropW, h:vb.h }
        };
        BALL_VB = { w:cropW, h:vb.h };
        BALL_CX = cropW / 2;
        BALL_CY = 174.511719;
        BALL_R = 155.5;
      } else {
        BALL_LAYER_CROPS = null;
        BALL_VB = { w:paneW, h:vb.h };
        inferSplitBallGeometry(vb, paneW);
      }
    } else {
      BALL_SPLIT_X = 0;
      BALL_LAYER_CROPS = null;
      BALL_VB = { w:vb.w, h:vb.h };
      BALL_CX = BALL_DEFAULT_GEOM.cx;
      BALL_CY = BALL_DEFAULT_GEOM.cy;
      BALL_R = BALL_DEFAULT_GEOM.r;
    }
    BALL_RH = Math.round(BALL_RW * BALL_VB.h / BALL_VB.w);
  }

  function inferSplitBallGeometry(vb, paneW){
    var nodes = ballEl.querySelectorAll("path,circle,ellipse,rect,polygon,polyline,line");
    var u = null;
    for (var i=0;i<nodes.length;i++){
      var b; try { b = nodes[i].getBBox(); } catch(e){ continue; }
      if (!b || b.width <= 0 || b.height <= 0) continue;
      var midX = b.x + b.width/2;
      if (midX > vb.x + paneW) continue;
      if (!u) u = { x:b.x, y:b.y, x2:b.x+b.width, y2:b.y+b.height };
      else {
        u.x = Math.min(u.x, b.x);
        u.y = Math.min(u.y, b.y);
        u.x2 = Math.max(u.x2, b.x + b.width);
        u.y2 = Math.max(u.y2, b.y + b.height);
      }
    }
    if (u){
      var bw = u.x2 - u.x, bh = u.y2 - u.y;
      BALL_CX = u.x - vb.x + bw/2;
      BALL_CY = u.y - vb.y + bh/2;
      BALL_R = Math.min(bw, bh) * 0.52;
    } else {
      BALL_CX = paneW * 0.5;
      BALL_CY = vb.h * 0.5;
      BALL_R = Math.min(paneW, vb.h) * 0.48;
    }
  }

  function init(){
    configureBallSource();
    detectEyes();
    rasterizeBall();
    rasterizeLogoVariant("noeyes");
    rasterizeLogoVariant("eyes");
    layout();
    window.addEventListener("resize", onResize);
    if (dlBtn) dlBtn.addEventListener("click", startRecording);
    requestAnimationFrame(frame);
  }

  // ---- Localizar bounding boxes de los ojos (en coords del viewBox) ----
  function detectEyes(){
    var ps = logoEl.querySelectorAll("path");
    var found = [];
    for (var i=0;i<ps.length;i++){
      var d = ps[i].getAttribute("d") || "";
      for (var j=0;j<EYE_PREFIXES.length;j++){
        if (d.indexOf(EYE_PREFIXES[j]) === 0){ found.push(ps[i]); break; }
      }
    }
    if (found.length !== 2){
      var arr = [];
      for (var k=0;k<ps.length;k++){
        var b; try { b = ps[k].getBBox(); } catch(e){ continue; }
        var cy = (b.y + b.height/2) / LOGO_VB.h;
        arr.push({ el:ps[k], b:b, area:b.width*b.height, cy:cy });
      }
      arr = arr.filter(function(o){ return o.cy>0.45 && o.cy<0.72; })
               .sort(function(a,b){ return a.area-b.area; });
      found = arr.slice(0,2).map(function(o){ return o.el; });
    }
    eyeBoxes = [];
    for (var m=0;m<found.length;m++){
      var bb; try { bb = found[m].getBBox(); } catch(e){ continue; }
      eyeBoxes.push({ x:bb.x-2, y:bb.y-2, w:bb.width+4, h:bb.height+4 });
    }
  }

  function addBallSamplesFromCanvas(source, spin, out){
    var o = source.getContext("2d");
    var d = o.getImageData(0,0,BALL_RW,BALL_RH).data;
    var step = 2;
    for (var y=0;y<BALL_RH;y+=step){
      for (var x=0;x<BALL_RW;x+=step){
        var idx=(y*BALL_RW+x)*4;
        if (d[idx+3]>40){
          var vx=(x/BALL_RW)*BALL_VB.w, vy=(y/BALL_RH)*BALL_VB.h;
          if (Math.hypot(vx-BALL_CX, vy-BALL_CY) <= BALL_R)
            out.push({ nx:x/BALL_RW, ny:y/BALL_RH, r:d[idx], g:d[idx+1], b:d[idx+2], spin:spin });
        }
      }
    }
  }

  function drawSvgCropToCanvas(img, crop, targetCtx, srcRW, srcRH){
    var sx = ((crop.x - BALL_SRC_VB.x) / BALL_SRC_VB.w) * srcRW;
    var sy = ((crop.y - BALL_SRC_VB.y) / BALL_SRC_VB.h) * srcRH;
    var sw = (crop.w / BALL_SRC_VB.w) * srcRW;
    var sh = (crop.h / BALL_SRC_VB.h) * srcRH;
    targetCtx.drawImage(img, sx, sy, sw, sh, 0, 0, BALL_RW, BALL_RH);
  }

  // ---- Rasterizar balon (display + muestreo de color) ----
  function rasterizeBall(){
    try {
      ballTainted = false;
      var srcRW = BALL_SPLIT ? Math.round(BALL_RW * (BALL_SRC_VB.w / BALL_VB.w)) : BALL_RW;
      var srcRH = BALL_RH;
      var clone = ballEl.cloneNode(true);
      clone.setAttribute("width", srcRW);
      clone.setAttribute("height", srcRH);
      var svgStr = new XMLSerializer().serializeToString(clone);
      var url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);
      var img = new Image();
      img.onload = function(){
        try {
          var off = document.createElement("canvas");
          off.width = BALL_RW; off.height = BALL_RH;
          var o = off.getContext("2d");
          o.clearRect(0,0,BALL_RW,BALL_RH);
          ballTraceImg = null;
          ballColorImg = null;
          if (BALL_SPLIT){
            var splitPx = Math.max(1, Math.min(srcRW-1, Math.round(((BALL_SPLIT_X - BALL_SRC_VB.x) / BALL_SRC_VB.w) * srcRW)));
            var colorOff = document.createElement("canvas");
            var traceOff = document.createElement("canvas");
            colorOff.width = traceOff.width = BALL_RW;
            colorOff.height = traceOff.height = BALL_RH;
            var co = colorOff.getContext("2d");
            var to = traceOff.getContext("2d");
            co.clearRect(0,0,BALL_RW,BALL_RH);
            to.clearRect(0,0,BALL_RW,BALL_RH);
            if (BALL_LAYER_CROPS){
              drawSvgCropToCanvas(img, BALL_LAYER_CROPS.color, co, srcRW, srcRH);
              drawSvgCropToCanvas(img, BALL_LAYER_CROPS.trace, to, srcRW, srcRH);
            } else {
              co.drawImage(img, splitPx, 0, srcRW-splitPx, srcRH, 0, 0, BALL_RW, BALL_RH);
              to.drawImage(img, 0, 0, splitPx, srcRH, 0, 0, BALL_RW, BALL_RH);
            }
            o.drawImage(colorOff, 0, 0);
            o.drawImage(traceOff, 0, 0);
            ballColorImg = colorOff;
            ballTraceImg = traceOff;
          } else {
            o.drawImage(img, 0, 0, BALL_RW, BALL_RH);
          }
          ballImg = off;
          // color de particulas; si el SVG viene dividido, solo el trazo rota.
          try {
            var samples = [];
            if (BALL_SPLIT && ballColorImg && ballTraceImg){
              addBallSamplesFromCanvas(ballColorImg, false, samples);
              addBallSamplesFromCanvas(ballTraceImg, true, samples);
            } else {
              addBallSamplesFromCanvas(off, true, samples);
            }
            ballSamples = samples.length ? samples : null;
          } catch(e){ ballSamples = null; ballTainted = true; }
        } catch(e){ ballImg = null; ballTraceImg = null; ballColorImg = null; ballSamples = null; }
        ballReady = true; ballRasterDone = true;
        if (needRebuild) buildParticles();
        maybeReady();
      };
      img.onerror = function(){
        ballImg = null; ballTraceImg = null; ballColorImg = null; ballSamples = null; ballReady = true; ballRasterDone = true;
        if (needRebuild) buildParticles();
        maybeReady();
      };
      img.src = url;
    } catch(e){
      ballImg = null; ballTraceImg = null; ballColorImg = null; ballSamples = null; ballReady = true; ballRasterDone = true; maybeReady();
    }
  }

  // ---- Rasterizar variantes del logo (sin ojos / solo ojos) ----
  function rasterizeLogoVariant(kind){
    try {
      var clone = logoEl.cloneNode(true);
      clone.setAttribute("width", LOGO_RW);
      clone.setAttribute("height", LOGO_RH);
      var ps = clone.querySelectorAll("path");
      for (var i=0;i<ps.length;i++){
        var d = ps[i].getAttribute("d") || "";
        var isEye = false;
        for (var j=0;j<EYE_PREFIXES.length;j++){ if (d.indexOf(EYE_PREFIXES[j])===0){ isEye=true; break; } }
        if (kind === "noeyes" && isEye) ps[i].setAttribute("style","opacity:0");
        if (kind === "eyes" && !isEye) ps[i].setAttribute("style","opacity:0");
      }
      var svgStr = new XMLSerializer().serializeToString(clone);
      var url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);
      var img = new Image();
      img.onload = function(){
        if (kind === "noeyes") noEyesImg = img; else eyesImg = img;
        logoImgReady++;
        maybeReady();
      };
      img.onerror = function(){ logoImgReady++; maybeReady(); };
      img.src = url;
    } catch(e){ logoImgReady++; maybeReady(); }
  }

  function maybeReady(){
    if (ballReady && logoImgReady >= 2){
      assetsReady = true;
      if (dlBtn){ dlBtn.disabled = false; dlBtn.textContent = "Descargar video"; }
    }
  }

  var resizeTimer = null;
  function onResize(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 120); }

  function layout(){
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    canvas.style.width = W+"px"; canvas.style.height = H+"px";

    var maxW = W*0.72, maxH = H*0.62;
    var sL = Math.min(maxW/LOGO_VB.w, maxH/LOGO_VB.h);
    var lw = LOGO_VB.w*sL, lh = LOGO_VB.h*sL;
    logoBox = { x:(W-lw)/2, y:(H-lh)/2, w:lw, h:lh };

    var side = Math.min(W,H)*0.36;
    var bh = side, bw = side*(BALL_VB.w/BALL_VB.h);
    ballBox = { x:(W-bw)/2, y:(H-bh)/2, w:bw, h:bh };

    buildParticles();
  }

  // ---- Muestreo del logo (geometria) ----
  function sampleLogoTargets(){
    var paths = logoEl.querySelectorAll("path");
    var targets = [];
    if (!paths.length) return targets;
    var toX = function(vx){ return (logoBox.x+(vx/LOGO_VB.w)*logoBox.w)*dpr; };
    var toY = function(vy){ return (logoBox.y+(vy/LOGO_VB.h)*logoBox.h)*dpr; };
    var bb = [];
    for (var i=0;i<paths.length;i++){ var b=null; try{b=paths[i].getBBox();}catch(e){} bb.push(b); }
    var pt=null; try{pt=logoEl.createSVGPoint();}catch(e){pt=null;}
    var mk=function(x,y){ if(pt){pt.x=x;pt.y=y;return pt;} return new DOMPoint(x,y); };
    var fillOK = (typeof paths[0].isPointInFill==="function");
    if (fillOK){ try{ paths[0].isPointInFill(mk(-9999,-9999)); }catch(e){ fillOK=false; } }
    if (fillOK){
      var step=4;
      for (var yy=0;yy<=LOGO_VB.h;yy+=step){
        for (var xx=0;xx<=LOGO_VB.w;xx+=step){
          var P=mk(xx,yy);
          for (var pi=0;pi<paths.length;pi++){
            var bx=bb[pi];
            if (bx && (xx<bx.x||xx>bx.x+bx.width||yy<bx.y||yy>bx.y+bx.height)) continue;
            if (paths[pi].isPointInFill(P)){ targets.push(toX(xx),toY(yy)); break; }
          }
        }
      }
    }
    if (targets.length===0){
      for (var p2=0;p2<paths.length;p2++){
        var pa=paths[p2]; if(!pa.getTotalLength) continue;
        var len=0; try{len=pa.getTotalLength();}catch(e){len=0;} if(!len) continue;
        var cnt=Math.max(2,Math.floor(len/1.4));
        for (var s=0;s<cnt;s++){ var q; try{q=pa.getPointAtLength((s/cnt)*len);}catch(e){continue;} targets.push(toX(q.x),toY(q.y)); }
      }
    }
    return targets;
  }

  function buildParticles(){
    if (logoBox.w<=0){ particles=[]; return; }
    needRebuild = !ballRasterDone;

    var tgt = sampleLogoTargets();
    var tCount = tgt.length/2;
    if (tCount===0){ particles=[]; return; }
    var N = Math.min(N_TARGET, tCount);

    var chosenT = new Array(N);
    if (tCount<=N){ for (var i=0;i<N;i++) chosenT[i]=[tgt[i*2],tgt[i*2+1]]; }
    else { for (var j=0;j<N;j++){ var k=(Math.random()*tCount)|0; chosenT[j]=[tgt[k*2],tgt[k*2+1]]; } }

    var cxD=(ballBox.x+ballBox.w/2)*dpr, cyD=(ballBox.y+ballBox.h/2)*dpr;
    var Rd=Math.min(ballBox.w,ballBox.h)*0.5*dpr*0.96;

    var chosenS = new Array(N);
    if (ballSamples && ballSamples.length){
      var m=ballSamples.length;
      for (var a=0;a<N;a++){
        var smp=ballSamples[(Math.random()*m)|0];
        var sx=(smp.nx*BALL_VB.w - BALL_CX) / BALL_VB.w;
        var sy=(smp.ny*BALL_VB.h - BALL_CY) / BALL_VB.h;
        chosenS[a]={ x:cxD+sx*ballBox.w*dpr, y:cyD+sy*ballBox.h*dpr, r:smp.r,g:smp.g,b:smp.b, spin:smp.spin !== false };
      }
    } else {
      for (var b=0;b<N;b++){
        var ang=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random())*Rd;
        chosenS[b]={ x:cxD+Math.cos(ang)*rr, y:cyD+Math.sin(ang)*rr, r:LOGO_DARK.r,g:LOGO_DARK.g,b:LOGO_DARK.b, spin:true };
      }
    }

    // rotar solo las fuentes que pertenecen al trazo del balon al disolverse.
    var theta = ballDissolveRot();
    var cosT = Math.cos(theta), sinT = Math.sin(theta);
    for (var rI=0; rI<N; rI++){
      var sp = chosenS[rI];
      if (sp.spin === false) continue;
      var rdx = sp.x - cxD, rdy = sp.y - cyD;
      sp.x = cxD + rdx*cosT - rdy*sinT;
      sp.y = cyD + rdx*sinT + rdy*cosT;
    }

    chosenT.sort(function(p,q){ return (p[0]-q[0])||(p[1]-q[1]); });
    chosenS.sort(function(p,q){ return (p.x-q.x)||(p.y-q.y); });

    particles = new Array(N);
    for (var c=0;c<N;c++){
      var s2=chosenS[c], e2=chosenT[c];
      var mx=(s2.x+e2[0])/2, my=(s2.y+e2[1])/2;
      var ddx=e2[0]-s2.x, ddy=e2[1]-s2.y;
      var dist=Math.hypot(ddx,ddy)||1;
      var nx=-ddy/dist, ny=ddx/dist;
      var offC=(Math.random()-0.5)*dist*0.16;

      particles[c]={ sx:s2.x,sy:s2.y, ex:e2[0],ey:e2[1], cx:mx+nx*offC, cy:my+ny*offC,
        r:s2.r,g:s2.g,b:s2.b, delay:Math.random()*0.32, size:(Math.random()*0.6+1.0)*dpr };
    }
  }

  // ---- Dibujo ----
  // altura de rebote (0..1): caida inicial + rebotes decrecientes
  function bounceHeight(p){
    var r = 0.5, n = 3;
    var durs = [1.0], heights = [1.0], types = [0], tot = 1.0; // type 0 = caida
    for (var k=1;k<=n;k++){ var hk=Math.pow(r,k); var dk=2*Math.sqrt(hk); durs.push(dk); heights.push(hk); types.push(1); tot+=dk; }
    var acc=0;
    for (var i=0;i<durs.length;i++){
      var seg=durs[i]/tot;
      if (p < acc+seg || i===durs.length-1){
        var tau=(p-acc)/seg; if(tau<0)tau=0; if(tau>1)tau=1;
        if (types[i]===0) return 1 - tau*tau;        // caida (apex -> suelo)
        return 4*heights[i]*tau*(1-tau);              // rebote (parabola)
      }
      acc+=seg;
    }
    return 0;
  }

  // rotacion del balon en el instante de disolverse (su ultimo rebote)
  function ballDissolveRot(){
    var radius = (BALL_R/BALL_VB.w) * ballBox.w;
    return ((0.26 * W) / radius) * 2.2;
  }

  // movimiento del balon: rueda y pica; en su ultimo rebote se desintegra (sin vuelta extra)
  function ballMotion(t){
    var RCx = ballBox.x + ballBox.w/2, RCy = ballBox.y + ballBox.h/2;
    var radius = (BALL_R/BALL_VB.w) * ballBox.w;
    var startOff = -0.26 * W;
    var spin = 2.2;
    var amp = Math.min(0.28*H, RCy - radius - 12); if (amp < 0.12*H) amp = 0.12*H;

    var tb = (t < T_BALL) ? t : T_BALL;        // se congela en el ultimo rebote
    var p = clamp01(tb / T_BALL);
    var eo = easeOutCubic(p);
    var ox = startOff*(1-eo);                   // entra rodando desde la izquierda
    var rot = ((ox - startOff)/radius) * spin;  // rota segun la distancia recorrida
    var bh = bounceHeight(p);                    // pica; el ultimo rebote cae justo en p=1
    var oy = -bh*amp;
    var thr = 0.06;
    var s = bh < thr ? (thr-bh)/thr : 0;         // squash sutil al tocar el suelo
    s *= clamp01(1 - smoothstep((p-0.85)/0.15));
    return { ox:ox, oy:oy, rot:rot, sx:1+0.06*s, sy:1-0.06*s };
  }

  function drawBall(alpha, t){
    var mo = ballMotion(t);
    var cxD = (ballBox.x + ballBox.w/2 + mo.ox) * dpr;
    var cyD = (ballBox.y + ballBox.h/2 + mo.oy) * dpr;
    var bw = ballBox.w*dpr, bh = ballBox.h*dpr;
    var imgX = -(BALL_CX / BALL_VB.w) * bw;
    var imgY = -(BALL_CY / BALL_VB.h) * bh;

    if (BALL_SPLIT && ballColorImg && ballTraceImg && !(ballTainted && recording)){
      var fr=BALL_R/BALL_VB.w;
      var fillFr=Math.max(0, fr - 0.006);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cxD, cyD); ctx.scale(mo.sx, mo.sy);
      ctx.beginPath(); ctx.arc(0, 0, fillFr*bw, 0, Math.PI*2); ctx.clip();
      ctx.drawImage(ballColorImg, imgX, imgY, bw, bh);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cxD, cyD); ctx.scale(mo.sx, mo.sy); ctx.rotate(mo.rot);
      ctx.beginPath(); ctx.arc(0, 0, fr*bw, 0, Math.PI*2); ctx.clip();
      ctx.drawImage(ballTraceImg, imgX, imgY, bw, bh);
      ctx.restore();
      return;
    }

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cxD, cyD); ctx.scale(mo.sx, mo.sy); ctx.rotate(mo.rot);
    if (ballImg && !(ballTainted && recording)){
      var fr2=BALL_R/BALL_VB.w;
      ctx.beginPath(); ctx.arc(0, 0, fr2*bw, 0, Math.PI*2); ctx.clip();
      ctx.drawImage(ballImg, imgX, imgY, bw, bh);
    } else {
      ctx.fillStyle="#b5b5b5"; ctx.beginPath(); ctx.arc(0,0,Math.min(bw,bh)*0.48,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles(alpha, mp){
    if (!particles.length || alpha<=0) return;
    var denom=1-0.32;
    ctx.save();
    ctx.globalAlpha=alpha;
    for (var i=0;i<particles.length;i++){
      var p=particles[i], x,y,cT;
      if (mp>=1){ x=p.ex; y=p.ey; cT=1; }
      else if (mp<=0){ x=p.sx; y=p.sy; cT=0; }
      else {
        var e=easeInOutCubic(clamp01((mp-p.delay)/denom)), u=1-e;
        x=u*u*p.sx+2*u*e*p.cx+e*e*p.ex;
        y=u*u*p.sy+2*u*e*p.cy+e*e*p.ey;
        cT=e;
      }
      var r=(p.r+(LOGO_DARK.r-p.r)*cT)|0;
      var g=(p.g+(LOGO_DARK.g-p.g)*cT)|0;
      var b=(p.b+(LOGO_DARK.b-p.b)*cT)|0;
      ctx.fillStyle="rgb("+r+","+g+","+b+")";
      var sz=p.size;
      ctx.fillRect(x-sz*0.5, y-sz*0.5, sz, sz);
    }
    ctx.restore();
  }

  // dibuja el logo (raster sin ojos + ojos que pueden pestañear)
  function drawLogo(alpha, blinkA, ty, sc, blur){
    if (!noEyesImg) return;
    var cxD=(logoBox.x+logoBox.w/2)*dpr, cyD=(logoBox.y+logoBox.h/2)*dpr;
    var bx=logoBox.x*dpr, by=logoBox.y*dpr, bw=logoBox.w*dpr, bh=logoBox.h*dpr;

    ctx.save();
    ctx.globalAlpha=alpha;
    if (blur>0){ ctx.filter="blur("+(blur*dpr)+"px)"; }
    ctx.translate(cxD, cyD + ty*dpr);
    ctx.scale(sc, sc);
    ctx.translate(-cxD, -cyD);

    ctx.drawImage(noEyesImg, bx, by, bw, bh);

    if (eyesImg){
      for (var i=0;i<eyeBoxes.length;i++){
        var eb=eyeBoxes[i];
        // origen en el raster eyesImg
        var sx=(eb.x/LOGO_VB.w)*LOGO_RW, sy=(eb.y/LOGO_VB.h)*LOGO_RH;
        var sw=(eb.w/LOGO_VB.w)*LOGO_RW, sh=(eb.h/LOGO_VB.h)*LOGO_RH;
        // destino en el canvas
        var ddx=bx+(eb.x/LOGO_VB.w)*bw, ddy=by+(eb.y/LOGO_VB.h)*bh;
        var ddw=(eb.w/LOGO_VB.w)*bw, ddh=(eb.h/LOGO_VB.h)*bh;
        var sh2 = ddh*(1-blinkA);            // aplastar verticalmente (parpadeo)
        var sy2 = ddy + (ddh-sh2)/2;
        if (sh2 > 0.5) ctx.drawImage(eyesImg, sx,sy,sw,sh, ddx,sy2,ddw,sh2);
      }
    }
    ctx.restore();
    ctx.filter = "none";
  }

  function drawScribbleLine(x1, x2, y, amp, alpha, erase, phase, drag){
    if (alpha <= 0) return;
    var len = x2 - x1;
    var visible = 1 - smoothstep((erase - 0.60) / 0.40);
    var trim = smoothstep((erase - 0.82) / 0.18);
    var leftTrim = len * 0.04 * trim;
    var rightTrim = len * 0.12 * trim;
    x1 += leftTrim;
    x2 -= rightTrim;
    if (x2 <= x1) return;

    ctx.save();
    ctx.globalAlpha = alpha * visible;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgb(" + LOGO_DARK.r + "," + LOGO_DARK.g + "," + LOGO_DARK.b + ")";
    for (var pass=0; pass<4; pass++){
      var wobble = amp * (0.45 + pass*0.18);
      ctx.lineWidth = Math.max(1.2*dpr, (5.6 - pass*0.9) * dpr);
      ctx.beginPath();
      var steps = 38;
      for (var i=0;i<=steps;i++){
        var u = i/steps;
        var lead = smoothstep((drag - (1-u)*0.52) / 0.36);
        var tail = smoothstep((drag - (1-u)*0.36) / 0.46);
        var offscreenDrop = canvas.height - y + 180*dpr + amp*10;
        var swing = Math.sin(lead*Math.PI) * canvas.width * 0.06 * (0.35 + u*0.65);
        var x = x1 + (x2-x1)*u + swing;
        var noise = Math.sin(u*28 + phase + pass*1.9) + 0.55*Math.sin(u*71 + phase*0.7 + pass);
        var sag = Math.sin((u - drag)*Math.PI*2.4) * amp * 2.0 * lead * (1-tail);
        var yy = y + offscreenDrop*lead + noise*wobble*(1 - lead*0.55) + sag + Math.sin(u*Math.PI*2 + pass)*amp*0.12;
        if (i===0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // salida final: todo se comprime en una linea y el garabato cae/desaparece.
  function drawExitScribble(P){
    if (!noEyesImg) return;
    var bx=logoBox.x*dpr, by=logoBox.y*dpr, bw=logoBox.w*dpr, bh=logoBox.h*dpr;
    var collapse = easeInOutCubic(clamp01(P / 0.28));
    var drag = easeInOutCubic(clamp01((P - 0.12) / 0.70));
    var lineY = by + bh/2;
    var logoAlpha = 1 - smoothstep((P - 0.24) / 0.18);
    var lineAlpha = smoothstep(P / 0.18) * (1 - smoothstep((P - 0.88) / 0.12));

    if (logoAlpha > 0){
      var sy = Math.max(0.018, 1 - collapse*0.982);
      var sx = 1 + collapse*0.08;
      ctx.save();
      ctx.globalAlpha = logoAlpha;
      if (collapse > 0.45) ctx.filter = "blur(" + ((collapse - 0.45) * 1.2 * dpr) + "px)";
      ctx.translate(bx + bw/2, by + bh/2);
      ctx.scale(sx, sy);
      ctx.translate(-(bx + bw/2), -(by + bh/2));
      ctx.drawImage(noEyesImg, bx, by, bw, bh);
      if (eyesImg) ctx.drawImage(eyesImg, bx, by, bw, bh);
      ctx.restore();
      ctx.filter = "none";
    }

    var amp = (3 + 5 * (1 - Math.min(1, drag))) * dpr;
    var erase = clamp01((P - 0.76) / 0.20);
    if (drag > 0.08){
      drawScribbleLine(bx + bw*0.03, bx + bw*0.97, lineY, amp*1.08, lineAlpha*0.22, erase+0.08, P*18 - 1.6, Math.max(0, drag-0.10));
    }
    drawScribbleLine(bx + bw*0.03, bx + bw*0.97, lineY, amp, lineAlpha, erase, P*18, drag);
  }

  // dos parpadeos dentro de la fase blink (u en [0,1])
  function blinkAmount(u){
    var a1 = peak(u, 0.22, 0.07);
    var a2 = peak(u, 0.52, 0.07);
    return Math.max(a1, a2);
  }
  function peak(u, c, hw){
    var d = Math.abs(u - c);
    if (d >= hw) return 0;
    return smoothstep(1 - d/hw);
  }

  function render(t){
    // fondo unico
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (t < T_BALL){
      drawBall(1, t);

    } else if (t < T_DISS){
      var p2=(t-T_BALL)/D.diss, k=easeInOutSine(p2);
      drawBall(1-k, t);
      drawParticles(k, 0);

    } else if (t < T_MORPH){
      var mp=(t-T_DISS)/D.morph;
      drawParticles(1, mp);

    } else if (t < T_CRY){
      var cp=(t-T_MORPH)/D.cry;
      drawParticles(1-easeInOutSine(cp), 1);
      drawLogo(easeOutCubic(cp), 0, 0, 1, 0);

    } else if (t < T_HOLD){
      drawLogo(1, 0, 0, 1, 0);

    } else if (t < T_BLINK){
      var u=(t-T_HOLD)/D.blink;
      drawLogo(1, blinkAmount(u), 0, 1, 0);

    } else if (t < T_EXIT){
      var P = (t - T_BLINK)/D.exit;
      drawExitScribble(P);

    } else {
      // pausa: solo fondo
    }
  }

  function frame(ts){
    if (startTs===null) startTs=ts;
    var t=(ts-startTs)/1000 * TIME_SCALE;

    if (recording && recorder && recorder.state==="recording" && t>=STOP_AT){
      try { recorder.stop(); } catch(e){}
    }

    // Logo armado (tras el parpadeo): avisa al padre y congela en el logo
    // estable. React reemplaza el iframe por el webp + corona + estadisticas.
    if (t >= T_BLINK && !recording){
      if (!doneNotified){
        doneNotified = true;
        try { parent.postMessage("winner-animation-done", "*"); } catch(e){}
      }
      render(T_HOLD);
      requestAnimationFrame(frame);
      return;
    }

    if (t>=T_END){ if (LOOP){ startTs=ts; t=0; } else { t=T_END; } }

    render(t);

    if (recording && recCtx){
      recCtx.drawImage(canvas, 0, 0, recCanvas.width, recCanvas.height);
    }
    requestAnimationFrame(frame);
  }

  // ---- Grabacion de video ----
  function pickMime(){
    var c = [
      "video/webm;codecs=vp9",
      "video/mp4;codecs=avc1.640028",
      "video/mp4",
      "video/webm;codecs=vp8",
      "video/webm"
    ];
    for (var i=0;i<c.length;i++){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c[i])){
        return { mime:c[i], ext: (c[i].indexOf("mp4")>=0 ? "mp4" : "webm") };
      }
    }
    return { mime:"video/webm", ext:"webm" };
  }

  function startRecording(){
    if (recording || !assetsReady) return;
    if (!window.MediaRecorder){ alert("Tu navegador no soporta la grabacion de video (MediaRecorder)."); return; }

    recording = true;
    dlBtn.disabled = true; dlBtn.textContent = "Grabando…";

    // maxima calidad: resolucion completa del canvas (tope 4K), dimensiones pares
    var maxDim = 3840;
    var cw = canvas.width, ch = canvas.height;
    var scl = Math.min(1, maxDim / Math.max(cw, ch));
    var rw = Math.round(cw * scl), rh = Math.round(ch * scl);
    rw -= rw % 2; rh -= rh % 2;
    if (rw < 2) rw = 2; if (rh < 2) rh = 2;

    recCanvas = document.createElement("canvas");
    recCanvas.width = rw; recCanvas.height = rh;
    recCtx = recCanvas.getContext("2d");

    var sel = pickMime();
    // bitrate alto proporcional a la resolucion (~0.25 bits/px/frame), 12-120 Mbps
    var bitrate = Math.max(12000000, Math.min(120000000, Math.round(rw * rh * 60 * 0.25)));

    try {
      var stream = recCanvas.captureStream(60);
      recorder = new MediaRecorder(stream, { mimeType: sel.mime, videoBitsPerSecond: bitrate });
      recChunks = [];
      recorder.ondataavailable = function(e){ if (e.data && e.data.size) recChunks.push(e.data); };
      recorder.onstop = function(){
        var blob = new Blob(recChunks, { type: (recorder && recorder.mimeType) || sel.mime });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "mapache_animacion." + sel.ext;
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
        recording = false; recorder = null; recCtx = null; recCanvas = null;
        dlBtn.disabled = false; dlBtn.textContent = "Descargar video";
      };
      startTs = null;          // reinicia un ciclo desde el balon
      recorder.start();
    } catch(err){
      recording = false; dlBtn.disabled = false; dlBtn.textContent = "Descargar video";
      alert("No se pudo iniciar la grabacion: " + (err && err.message ? err.message : err));
    }
  }

  if (document.readyState === "loading"){
    window.addEventListener("DOMContentLoaded", function(){ requestAnimationFrame(init); });
  } else {
    requestAnimationFrame(init);
  }
})();
</script>
